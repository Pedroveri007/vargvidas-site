<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — VARG</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="../logo/logo.svg" alt="Logo VARG">
      <div class="brand-text"><strong>VARG</strong><span>Vidas em Alerta para Reencontro e Gestão</span></div>
    </a>
    <nav class="main-nav" id="main-menu">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-menu" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section>
  <div class="container login-wrap">
    <div class="form-card">
      <div class="mascot-banner">
        <img src="../logo/logo.svg" alt="Mascote VARG">
        <div>
          <strong>VARG</strong>
          <span>Conectando ajuda, cuidado e reencontro.</span>
        </div>
      </div>
      <div class="tabs">
        <button class="active" id="tab-login" onclick="showTab('login')">Entrar</button>
        <button id="tab-register" onclick="showTab('register')">Criar conta</button>
      </div>

      <form id="form-login">
        <div class="field"><label>E-mail</label><input required type="email" id="login-email"></div>
        <div class="field"><label>Senha</label><input required type="password" id="login-password"></div>
        <button class="btn btn-primary btn-block" type="submit">Entrar</button>
      </form>

      <form id="form-register" style="display:none">
        <div class="field"><label>Nome completo</label><input required id="reg-name"></div>
        <div class="field"><label>E-mail</label><input required type="email" id="reg-email"></div>
        <div class="field"><label>Telefone</label><input id="reg-phone"></div>
        <div class="field"><label>Senha</label><input required type="password" id="reg-password"></div>
        <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
      </form>
      <p class="helper" style="text-align:center;margin-top:14px">Entre com seu e-mail e senha para acessar sua conta.</p>
    </div>
  </div>
</section>

<footer class="site">
  <div class="container footer-bottom"><span>© 2026 VARG</span></div>
</footer>

<script src="../js/app.js"></script>
<script>
  const authParams = new URLSearchParams(location.search);

  function showTab(t){
    document.getElementById("tab-login").classList.toggle("active", t==="login");
    document.getElementById("tab-register").classList.toggle("active", t==="register");
    document.getElementById("form-login").style.display = t==="login" ? "block":"none";
    document.getElementById("form-register").style.display = t==="register" ? "block":"none";
  }
  showTab(authParams.get("tab") === "register" ? "register" : "login");

  function registrationData() {
    return {
      nome: document.getElementById("reg-name").value.trim(),
      email: document.getElementById("reg-email").value.trim(),
      telefone: document.getElementById("reg-phone").value.trim(),
      senha: document.getElementById("reg-password").value
    };
  }

  document.getElementById("form-login").addEventListener("submit", async function(e){
    e.preventDefault();
    const button = this.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
      await DB.login(document.getElementById("login-email").value, document.getElementById("login-password").value);
      toast("Login realizado.");
      setTimeout(()=> location.href="painel.html", 800);
    } catch (error) {
      toast(error.message);
    } finally {
      button.disabled = false;
    }
  });
  document.getElementById("form-register").addEventListener("submit", async function(e){
    e.preventDefault();
    if (!this.reportValidity()) return;
    const button = this.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
      await DB.register(registrationData());
      toast("Conta criada com sucesso.");
      setTimeout(()=> location.href="painel.html", 800);
    } catch (error) {
      toast(error.message);
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
