<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estatísticas — VARG</title>
<link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="../logo/logo.svg" alt="Logo VARG">
      <div class="brand-text"><strong>VARG</strong><span>Conectando pessoas. Promovendo reencontros</span></div>
    </a>
    <nav class="main-nav" id="main-menu">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-menu" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section style="padding-bottom:0"><div class="container"><span class="eyebrow">Transparência</span><h1>Estatísticas</h1></div></section>
<section>
  <div class="container">
    <div class="stats-grid" id="stats-grid" style="margin-bottom:36px"></div>
    <div class="chart-layout single-chart-layout">
      <div class="chart-card chart-card--accent">
        <div class="chart-header">
          <div>
            <span class="eyebrow">Resumo</span>
            <h3>Casos por estado</h3>
          </div>
          <span class="chip" id="chart-total">0 casos</span>
        </div>
        <div class="mixed-chart-shell">
          <svg id="mixed-chart" class="mixed-chart" viewBox="0 0 340 210" role="img" aria-label="Gráfico de colunas e linha por estado"></svg>
        </div>
        <div class="mini-legend">
          <span><i class="dot dot--primary"></i> Casos</span>
          <span><i class="dot dot--line"></i> Tendência</span>
        </div>
      </div>
    </div>
  </div>
</section>

<footer class="site"><div class="container footer-bottom"><span>© 2026 VARG</span></div></footer>

<script src="../js/app.js"></script>
<script>
  DB.stats().then(st => {
    document.getElementById("stats-grid").innerHTML = `
      <div class="stat-card"><div class="num">${st.ativos}</div><div class="lbl">Buscas ativas</div></div>
      <div class="stat-card"><div class="num">${st.encontrados}</div><div class="lbl">Pessoas reencontradas</div></div>
      <div class="stat-card"><div class="num">${st.urgentes}</div><div class="lbl">Casos urgentes</div></div>
      <div class="stat-card"><div class="num">${st.total ? Math.round(st.encontrados / st.total * 100) : 0}%</div><div class="lbl">Taxa de reencontro</div></div>
    `;

    const states = Object.entries(st.porEstado || {});
    const statuses = Object.entries(st.porStatus || {});

    const totalText = document.getElementById('chart-total');
    totalText.textContent = `${st.total || 0} casos`;

    function renderMixedChart(data) {
      const svg = document.getElementById('mixed-chart');
      if (!svg) return;
      if (!data.length) {
        svg.innerHTML = '<text x="170" y="110" text-anchor="middle" fill="var(--cinza-texto)" font-size="12">Nenhum dado</text>';
        return;
      }

      const width = 560;
      const height = 200;
      const pad = { top: 18, right: 18, bottom: 34, left: 26 };
      const values = data.map(([, value]) => Number(value) || 0);
      const max = Math.max(...values, 1);
      const chartWidth = width - pad.left - pad.right;
      const chartHeight = height - pad.top - pad.bottom;
      const step = chartWidth / data.length;
      const barWidth = Math.min(42, step * 0.62);

      const linePoints = data.map(([label, value], index) => {
        const x = pad.left + step * index + step / 2;
        const y = height - pad.bottom - ((Number(value) || 0) / max) * chartHeight;
        return `${x},${y}`;
      }).join(' ');

      const bars = data.map(([label, value], index) => {
        const x = pad.left + step * index + (step - barWidth) / 2;
        const barHeight = ((Number(value) || 0) / max) * chartHeight;
        const y = height - pad.bottom - barHeight;
        return `
          <rect class="bar" x="${x}" y="${y}" width="${barWidth}" height="${barHeight}" rx="7" fill="rgba(30,58,138,0.9)"></rect>
        `;
      }).join('');

      const points = data.map(([label, value], index) => {
        const x = pad.left + step * index + step / 2;
        const y = height - pad.bottom - ((Number(value) || 0) / max) * chartHeight;
        return `
          <circle class="point" cx="${x}" cy="${y}" r="4.5" fill="#ffffff" stroke="#ff7a59" stroke-width="2"></circle>
        `;
      }).join('');

      const axisLabels = data.map(([label], index) => {
        const x = pad.left + step * index + step / 2;
        const labelText = label.length > 10 ? `${label.slice(0, 10)}…` : label;
        return `<text x="${x}" y="${height - 12}" text-anchor="middle" fill="rgba(15,23,42,0.65)" font-size="10" font-weight="600">${labelText}</text>`;
      }).join('');

      svg.innerHTML = `
        <g>
          <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="rgba(15,23,42,0.12)" stroke-width="1" />
          <polyline points="${linePoints}" fill="none" stroke="#ff7a59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></polyline>
          ${bars}
          ${points}
          ${axisLabels}
        </g>
      `;
    }

    renderMixedChart(states);

    document.getElementById('chart-total').textContent = `${st.total || 0} casos`;
  }).catch(error => toast(error.message));
</script>
</body>
</html>
