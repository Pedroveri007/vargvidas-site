<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Família — VARG</title>
<link rel="stylesheet" href="../css/style.css?v=6">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="../logo/logo.svg" alt="Logo VARG">
      <div class="brand-text"><strong>VARG</strong><span>Vidas em Alerta para Reencontro e Gestão</span></div>
    </a>
    <nav class="main-nav" id="main-menu">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="main-menu" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section>
  <div class="container" id="painel-wrap"></div>
</section>

<footer class="site">
  <div class="container footer-bottom"><span>© 2026 VARG</span></div>
</footer>

<script src="../js/app.js"></script>
<script>
  const session = DB.getSession();
  const wrap = document.getElementById("painel-wrap");
  if (!session) {
    wrap.innerHTML = `<div class="empty-state"><h2>Você precisa entrar</h2><p>Acesse sua conta para ver os casos que você cadastrou.</p><a class="btn btn-secondary" href="auth.html">Entrar / Criar conta</a></div>`;
  } else {
    DB.getMyCases().then(cases => {
      const active = cases.filter(c => c.status === "active").length;
      const found = cases.filter(c => c.status === "found").length;
      const rows = cases.length ? cases.map(c => `<tr><td>${c.full_name}</td><td>${c.protocol}</td><td><span class="tag ${c.status === 'found' ? 'encontrado' : 'ativo'}">${statusLabel(c.status)}</span></td><td>${fmtDate(c.created_at)}</td><td>${c.status === 'active' ? `<button class="btn btn-outline-azul" onclick="requestFound('${c.id}')">Informar encontrado</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="5" class="empty-state">Nenhum caso cadastrado.</td></tr>';
      const displayName = session.nome?.trim() || 'família';
      wrap.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div><span class="eyebrow">Painel da família</span><h1 style="margin:0">Olá, ${escapeHtml(displayName)}</h1></div>
        <div style="display:flex;gap:10px">
          <a href="registrar.html" class="btn btn-primary">+ Novo caso</a>
          <button class="btn btn-outline-azul" onclick="DB.logout();location.href='index.html'">Sair</button>
        </div>
      </div>
      <div class="stats-grid" style="margin:28px 0">
        <div class="stat-card"><div class="num">${cases.length}</div><div class="lbl">Casos vinculados</div></div>
        <div class="stat-card"><div class="num">${active}</div><div class="lbl">Em andamento</div></div>
        <div class="stat-card"><div class="num">${found}</div><div class="lbl">Reencontrados</div></div>
        <div class="stat-card"><div class="num">0</div><div class="lbl">Visualizações totais</div></div>
      </div>
      <div class="info-box" id="notifications-box" style="margin-bottom:24px"><h4>Notificações</h4><p>Carregando...</p></div>
      <div class="info-box" id="security-box" style="margin-bottom:24px"><h4>Segurança da conta</h4><p>Carregando configurações...</p></div>
      <table>
        <thead><tr><th>Nome</th><th>Protocolo</th><th>Status</th><th>Cadastrado em</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
      let notificationExpiryTimer;
      async function loadNotifications() {
        const box = document.getElementById('notifications-box');
        try {
          const notifications = await DB.getNotifications();
          box.innerHTML = `<h4>Notificações</h4>${notifications.length ? `<ul>${notifications.map(notification => `<li>${escapeHtml(notification.mensagem)}</li>`).join('')}</ul>` : '<p>Nenhuma notificação.</p>'}`;
          clearTimeout(notificationExpiryTimer);
          const nextExpiry = notifications
            .filter(notification => notification.created_at)
            .map(notification => new Date(notification.created_at).getTime() + 60 * 60 * 1000)
            .filter(expiry => expiry > Date.now())
            .sort((first, second) => first - second)[0];
          if (nextExpiry) notificationExpiryTimer = setTimeout(loadNotifications, nextExpiry - Date.now());
        } catch (error) {
          box.innerHTML = `<h4>Notificações</h4><p>Não foi possível carregar os avisos. ${escapeHtml(error.message)}. O painel tentará novamente.</p>`;
        }
      }

      async function loadSecuritySettings() {
        const box = document.getElementById('security-box');
        try {
          const settings = await DB.getSecuritySettings();
          if (settings.emailTwoFactorEnabled) {
            box.innerHTML = `<h4>Verificação por e-mail ativa</h4>
              <p>Enviaremos um código de acesso para ${escapeHtml(settings.maskedEmail)} sempre que você entrar.</p>
              <form id="email-2fa-disable-form">
                <div class="field"><label for="email-2fa-disable-password">Senha atual</label><input required type="password" id="email-2fa-disable-password" autocomplete="current-password"></div>
                <button class="btn btn-outline-azul" type="submit">Desativar verificação por e-mail</button>
              </form>`;
            box.querySelector('#email-2fa-disable-form').addEventListener('submit', async event => {
              event.preventDefault();
              const button = event.currentTarget.querySelector('button[type="submit"]');
              button.disabled = true;
              try {
                await DB.disableEmailTwoFactor(document.getElementById('email-2fa-disable-password').value);
                toast('Verificação por e-mail desativada.');
                loadSecuritySettings();
              } catch (error) {
                toast(error.message);
              } finally {
                button.disabled = false;
              }
            });
            return;
          }

          box.innerHTML = `<h4>Verificação em duas etapas</h4>
            <p>Ao entrar, você receberá um código no endereço ${escapeHtml(settings.maskedEmail)}.</p>
            <form id="email-2fa-enable-form">
              <div class="field"><label for="email-2fa-enable-password">Confirme sua senha</label><input required type="password" id="email-2fa-enable-password" autocomplete="current-password"></div>
              <button class="btn btn-primary" type="submit">Ativar código por e-mail</button>
            </form>`;
          box.querySelector('#email-2fa-enable-form').addEventListener('submit', async event => {
            event.preventDefault();
            const button = event.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
              const setup = await DB.enableEmailTwoFactor(document.getElementById('email-2fa-enable-password').value);
              box.innerHTML = `<h4>Confirme seu endereço</h4>
                <p>Enviamos um código para ${escapeHtml(setup.maskedEmail)}. Digite-o para ativar a verificação por e-mail.</p>
                <form id="email-2fa-confirm-form">
                  <div class="field"><label for="email-2fa-confirm-code">Código de 6 dígitos</label><input required id="email-2fa-confirm-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6"></div>
                  <button class="btn btn-primary" type="submit">Confirmar e ativar</button>
                  <button class="btn btn-outline-azul" id="email-2fa-resend" type="button" disabled>Reenviar código</button>
                </form>`;
              const confirmationForm = box.querySelector('#email-2fa-confirm-form');
              const resendButton = box.querySelector('#email-2fa-resend');
              let resendTimer;
              function startResendCountdown(seconds) {
                let remaining = seconds;
                clearInterval(resendTimer);
                resendButton.disabled = true;
                resendButton.textContent = `Reenviar em ${remaining}s`;
                resendTimer = setInterval(() => {
                  remaining -= 1;
                  if (remaining <= 0) {
                    clearInterval(resendTimer);
                    resendButton.disabled = false;
                    resendButton.textContent = 'Reenviar código';
                  } else {
                    resendButton.textContent = `Reenviar em ${remaining}s`;
                  }
                }, 1000);
              }
              startResendCountdown(setup.resendAfterSeconds);
              confirmationForm.addEventListener('submit', async submitEvent => {
                submitEvent.preventDefault();
                const confirmButton = submitEvent.currentTarget.querySelector('button[type="submit"]');
                confirmButton.disabled = true;
                try {
                  await DB.confirmEmailTwoFactor(setup.setupToken, document.getElementById('email-2fa-confirm-code').value);
                  clearInterval(resendTimer);
                  toast('Verificação por e-mail ativada.');
                  loadSecuritySettings();
                } catch (error) {
                  toast(error.message);
                } finally {
                  confirmButton.disabled = false;
                }
              });
              resendButton.addEventListener('click', async () => {
                resendButton.disabled = true;
                try {
                  await DB.resendEmailCode(setup.setupToken);
                  startResendCountdown(60);
                  toast('Código reenviado.');
                } catch (error) {
                  toast(error.message);
                  startResendCountdown(60);
                }
              });
            } catch (error) {
              toast(error.message);
              button.disabled = false;
            }
          });
        } catch (error) {
          box.innerHTML = `<h4>Segurança da conta</h4><p>${escapeHtml(error.message)}</p>`;
        }
      }

      loadNotifications();
      loadSecuritySettings();
      const notificationsTimer = setInterval(() => {
        if (!document.hidden) loadNotifications();
      }, 15000);
      window.addEventListener('pagehide', () => {
        clearInterval(notificationsTimer);
        clearTimeout(notificationExpiryTimer);
      }, { once: true });
    }).catch(error => { wrap.innerHTML = `<div class="empty-state">${error.message}</div>`; });
  }
  async function requestFound(id) {
    if (!confirm('Solicitar análise de reencontro para este caso?')) return;
    try { await DB.requestFound(id); toast('Solicitação enviada.'); } catch (error) { toast(error.message); }
  }
</script>
</body>
</html>
