<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estatísticas — VARG</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <img class="brand-logo" src="logo.svg" alt="Logo VARG">
      <div class="brand-text"><strong>VARG</strong><span>Vidas em Alerta para Reencontro e Gestão</span></div>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="registrar.html">Registrar Desaparecimento</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section style="padding-bottom:0"><div class="container"><span class="eyebrow">Transparência</span><h1>Estatísticas</h1></div></section>
<section>
  <div class="container">
    <div class="stats-grid" id="stats-grid" style="margin-bottom:36px"></div>
    <div class="two-col">
      <div class="card-simple">
        <h3>Casos por estado</h3>
        <div id="por-estado" style="display:flex;flex-direction:column;gap:10px;margin-top:16px"></div>
      </div>
      <div class="card-simple">
        <h3>Casos por status</h3>
        <div id="por-status" style="display:flex;flex-direction:column;gap:10px;margin-top:16px"></div>
      </div>
    </div>
  </div>
</section>

<footer class="site"><div class="container footer-bottom"><span>© 2026 VARG</span></div></footer>

<script src="app.js"></script>
<script>
  const st = { porEstado: {}, porStatus: {} };
  document.getElementById("stats-grid").innerHTML = `
    <div class="stat-card"><div class="num">0</div><div class="lbl">Buscas ativas</div></div>
    <div class="stat-card"><div class="num">0</div><div class="lbl">Pessoas reencontradas</div></div>
    <div class="stat-card"><div class="num">0</div><div class="lbl">Casos urgentes</div></div>
    <div class="stat-card"><div class="num">0%</div><div class="lbl">Taxa de reencontro</div></div>
  `;
  function barRow(label, value, max) {
    const pct = max ? Math.round(value/max*100) : 0;
    return `<div>
      <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:4px"><span>${label}</span><strong>${value}</strong></div>
      <div style="background:var(--cinza-claro);border-radius:6px;height:8px;overflow:hidden"><div style="background:var(--azul);width:${pct}%;height:100%"></div></div>
    </div>`;
  }
  document.getElementById("por-estado").innerHTML = '<div class="empty-state" style="padding:20px 0">0</div>';
  document.getElementById("por-status").innerHTML = '<div class="empty-state" style="padding:20px 0">0</div>';
</script>
</body>
</html>
