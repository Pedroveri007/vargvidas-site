<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícia — VARG</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-text"><strong>VARG</strong><span>Vidas em Alerta para Reencontro e Gestão</span></div>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="registrar.html">Registrar Desaparecimento</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="noticias.html">Notícias</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section><div class="container" id="news-wrap" style="max-width:760px"></div></section>

<footer class="site"><div class="container footer-bottom"><span>© 2026 VARG — Protótipo de demonstração.</span></div></footer>

<script src="assets/app.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("slug");
  const n = DB.getNewsBySlug(slug);
  const wrap = document.getElementById("news-wrap");
  wrap.innerHTML = n ? `
    <div class="breadcrumb"><a href="noticias.html">Notícias</a> / ${n.title}</div>
    <span class="tag ativo">${n.category}</span>
    <h1 style="margin-top:12px">${n.title}</h1>
    <p class="helper">${fmtDate(n.published_at)}</p>
    <p style="margin-top:20px;font-size:1rem;line-height:1.7">${n.content}</p>
  ` : `<div class="empty-state"><h2>Notícia não encontrada</h2><a class="btn btn-secondary" href="noticias.html">Voltar</a></div>`;
</script>
</body>
</html>
