<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notícias — VARG</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-text"><strong>VARG</strong><span>Vidas em Alerta para Reencontro e Gestão</span></div>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="registrar.html">Registrar Desaparecimento</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="noticias.html">Notícias</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section style="padding-bottom:0"><div class="container"><span class="eyebrow">Acompanhe</span><h1>Notícias</h1></div></section>
<section><div class="container grid-3" id="news-list"></div></section>

<footer class="site"><div class="container footer-bottom"><span>© 2026 VARG — Protótipo de demonstração.</span></div></footer>

<script src="assets/app.js"></script>
<script>
  const news = DB.getNews();
  document.getElementById("news-list").innerHTML = news.map(n=>`
    <a class="card-simple" href="noticia.html?slug=${n.slug}" style="display:block">
      <span class="tag ativo">${n.category}</span>
      <h3 style="margin-top:12px">${n.title}</h3>
      <p style="font-size:.88rem;color:var(--cinza-texto)">${n.excerpt}</p>
      <div class="helper">${fmtDate(n.published_at)}</div>
    </a>
  `).join("");
</script>
</body>
</html>
