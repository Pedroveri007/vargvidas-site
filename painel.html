<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel da Família — VARG</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="site">
  <div class="nav-wrap">
    <a href="index.html" class="brand">
      <div class="brand-mark">V</div>
      <div class="brand-text"><strong>VARG</strong><span>Vidas em Alerta para Reencontro e Gestão</span></div>
    </a>
    <nav class="main-nav">
      <a href="index.html">Início</a>
      <a href="pessoas.html">Pessoas Desaparecidas</a>
      <a href="registrar.html">Registrar Desaparecimento</a>
      <a href="avistamento.html">Informar Avistamento</a>
      <a href="noticias.html">Notícias</a>
      <a href="estatisticas.html">Estatísticas</a>
      <a href="parceiros.html">Parceiros</a>
      <a href="sobre.html">Sobre</a>
      <a href="contato.html">Contato</a>
    </nav>
    <div class="nav-actions"><button class="hamburger" onclick="toggleMenu()">☰</button></div>
  </div>
</header>

<section>
  <div class="container" id="painel-wrap"></div>
</section>

<footer class="site">
  <div class="container footer-bottom"><span>© 2026 VARG — Protótipo de demonstração.</span></div>
</footer>

<script src="assets/app.js"></script>
<script>
  const session = DB.getSession();
  const wrap = document.getElementById("painel-wrap");
  if (!session) {
    wrap.innerHTML = `<div class="empty-state"><h2>Você precisa entrar</h2><p>Acesse sua conta para ver os casos que você cadastrou.</p><a class="btn btn-secondary" href="auth.html">Entrar / Criar conta</a></div>`;
  } else {
    const cases = DB.all().cases;
    wrap.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
        <div><span class="eyebrow">Painel da família</span><h1 style="margin:0">Olá, ${session.email}</h1></div>
        <div style="display:flex;gap:10px">
          <a href="registrar.html" class="btn btn-primary">+ Novo caso</a>
          <button class="btn btn-outline-azul" onclick="DB.logout();location.href='index.html'">Sair</button>
        </div>
      </div>
      <div class="stats-grid" style="margin:28px 0">
        <div class="stat-card"><div class="num">${cases.length}</div><div class="lbl">Casos vinculados</div></div>
        <div class="stat-card"><div class="num">${cases.filter(c=>c.status!=='found').length}</div><div class="lbl">Em andamento</div></div>
        <div class="stat-card"><div class="num">${cases.filter(c=>c.status==='found').length}</div><div class="lbl">Reencontrados</div></div>
        <div class="stat-card"><div class="num">${cases.reduce((a,c)=>a+c.views,0)}</div><div class="lbl">Visualizações totais</div></div>
      </div>
      <table>
        <thead><tr><th>Nome</th><th>Protocolo</th><th>Status</th><th>Cadastrado em</th><th></th></tr></thead>
        <tbody>
          ${cases.map(c=>`<tr>
            <td>${c.full_name}</td><td>${c.protocol}</td>
            <td><span class="tag ${c.status==='found'?'encontrado':'ativo'}">${statusLabel(c.status)}</span></td>
            <td>${fmtDate(c.created_at)}</td>
            <td><a href="caso.html?id=${c.id}" class="btn btn-outline-azul" style="padding:6px 12px;font-size:.78rem">Ver</a></td>
          </tr>`).join("")}
        </tbody>
      </table>
    `;
  }
</script>
</body>
</html>
